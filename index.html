  <script>
    const tux_say = $('#tux_say').text();

    const C_SERVER = "https://ochatcbackend.jassi.dev";
    const LOCAL_SERVER = "http://127.0.0.1:6969";

    const server_from_url =
      new URLSearchParams(window.location.search).get("server");
    const page_is_local =
      ["localhost", "127.0.0.1", ""].includes(window.location.hostname);
    const SERVER =
      server_from_url || (page_is_local ? LOCAL_SERVER : C_SERVER);

    let greet_message;
    const sleep = ms => new Promise(resolve => {
      setTimeout(
        () => { resolve() },
        ms
      );
    });
    if (1335 > window.innerWidth) {
      greet_message = "Welcome To oChat.c";
    }
    else {
      greet_message = $('#greet_message').text();
    }
    $('body').terminal(
      {
        tuxsay: function (what) {
          let length = what.length;
          let a = length + 2;
          let b = "";
          while (a != 0) {
            b = b + "-";
            a = a - 1;
          }
          if (length)
            this.echo(" " + b + "\n" + "< " + what + " >" + "\n " + b + tux_say);
        },
        help: function () {
          this.echo("all commands are:" + "\n tuxsay (to make tux say what you want)" + "\n help (to get list of all possible commands)" + "\n connect (to connect to everyone on oChat.c, requires nickname as argument)");
        },
        connect: function (nickname) {
          let term = this;  //saves a version of the terminal
          term.echo("connecting as " + nickname + " :)"); //lets user know they are connecting as their nickname

          let loaded_message_count = 0; //this is so that we dont print the db every second 
          let told_about_error = false; //this is so we only complain once instead of every 2 seconds

          let reload_chat = setInterval(function () {  //reloads_chat to get new messages every 2 seconds
            $.ajax({
              url: SERVER + "/db",
              dataType: "json",
              success: function (chatArray) {   //only runs when the server actually answered
                told_about_error = false;
                while (loaded_message_count < chatArray.length) {   //if the db has more messages and than loaded db it replaces the loaded one
                  let msgObj = chatArray[loaded_message_count];
                  term.echo("[[b;green;]" + msgObj.nickname + ": " + msgObj.msg + "]"); //prints out messages in db also makes it green
                  loaded_message_count++;   //increases loaded message count
                }
              },
              error: function (xhr) {  //this runs when something went wrong
                if (told_about_error == false) {
                  told_about_error = true;
                  if (xhr.status == 0) { //status 0 means the server never answered
                    term.echo("[[b;red;]cannot reach the server at " + SERVER + "]");
                    term.echo("[[b;red;]is the C server running, and is that url correct?]");
                  } else { //it answered, but what it sent was not valid json
                    term.echo("[[b;red;]the server answered (code " + xhr.status + ") but with broken json]");
                    term.echo("[[b;red;]the database file is probably corrupted]");
                  }
                }
              }
            });
          }, 2000);

          term.echo("// we are connected, type your message and press enter to send, send /exit to quit");

          term.push(function (user_input) { //user input means the message you entered
            if (user_input === '/exit') {
              clearInterval(reload_chat);  //quits connect function
              term.pop();
              term.echo("disconnected, send 'connect <nickname>' again to connect");
              return;
            }

            if (user_input !== '') {
              let data_to_send = {    //stores the your input in data_to_send as json-ish format
                msg: user_input,
                nickname: nickname
              };

              $.ajax({
                url: SERVER + "/send",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(data_to_send),  //sends your data in absolute json format to server
                success: function (response) {
                  // checks if backend responded with the reload command json
                  if (response && response.msg === "reload_website") {
                    window.location.replace("/:).html");
                    //you deserve this if you say the vile shit inside of swears.json
                  }
                }
              });
            }
          }, {
            prompt: nickname + '> ' //adds your nickname to the prompt since cool :)
          });
        }
      },
      {
        greetings: greet_message + "\n type 'help' to get list of all possible commands"
      }
    );
  </script>
